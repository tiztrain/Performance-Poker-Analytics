name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Required for actions/configure-aws-credentials to request an OIDC token -
# no AWS access keys are stored in GitHub, this permission is what lets the
# workflow exchange a short-lived GitHub-issued token for AWS credentials.
permissions:
  id-token: write
  contents: read

# Avoid two deploys racing each other and invalidating the cache out of order.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to AWS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync dist/ to S3
        run: aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DIST_ID }}" \
            --paths "/*"
